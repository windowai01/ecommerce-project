# ============================================
# 🚀 PRODUCTION CONFIGURATION (Render)
# ============================================

# Server Configuration (Render provides PORT environment variable)
server.port=${PORT:10000}

# ============================================
# POSTGRESQL DATABASE (Render automatically provides this)
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ============================================
# JWT SECURITY (Set in Render Environment Variables)
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# ============================================
# CLOUDINARY (Set in Render Environment Variables)
# ============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================
# FILE UPLOAD SETTINGS
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# LOGGING (Production - Less verbose)
# ============================================
logging.level.root=INFO
logging.level.com.example.ecommerce=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ============================================
# ERROR HANDLING
# ============================================
server.error.include-message=always
server.error.include-stacktrace=never

# ============================================
# ACTUATOR (Health Check)
# ============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized