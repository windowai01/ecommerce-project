# server Configuration
server.port=8080
spring.main.allow-circular-references=true

# Database Configuration (MySql)
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=ecom_user
spring.datasource.password=kevinmysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1200000

# JWT SECURITY Configuration
jwt.secret=this_is_a_super_secure_and_long_secret_key_for_jwt_tokens_minimum_256_bits_required
jwt.expiration=864000000

# CLOUDINARY CONFIGURATION
cloudinary.cloud-name=djxz7a3fo
cloudinary.api-key=979535181455772
cloudinary.api-secret=41ragRDQqL3RhrlLeM5lojZNO6Q

# FILE UPLOAD CONFIGURATION
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=1MB

# LOGGING CONFIGURATION
logging.level.root=INFO
logging.level.com.example.ecommerce=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ASYNC CONFIGURATION
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ACTUATOR (Health & Metrics)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ERROR HANDLING
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# TIMEZONE
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Razorpay Configuration
razorpay.key.id=rzp_test_your_key_id
razorpay.key.secret=your_key_secret


# SPRING DEVTOOLS CONFIGURATION (Hot Reload)
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2000
spring.devtools.restart.quiet-period=1000
spring.devtools.livereload.enabled=true


